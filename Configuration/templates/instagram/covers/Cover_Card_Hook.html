<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cover & Hook Master Template (Dynamic Universal Subject Framing)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
    }
    .background-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--object-position, center top);
    }

    /* -------------------------------------------------------------
       PLACEMENT 1: layout-left-split (Split Stack, Left-Aligned)
       ------------------------------------------------------------- */
    .layout-left-split .background-img {
      object-position: var(--object-position, 85% center);
    }
    .layout-left-split .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, rgba(6, 9, 14, 0.98) 0%, rgba(6, 9, 14, 0.88) 48%, rgba(6, 9, 14, 0.35) 68%, rgba(0, 0, 0, 0) 88%);
    }
    .layout-left-split .headline-container {
      position: absolute;
      top: 100px;
      left: 70px;
      width: 560px;
      z-index: 10;
    }
    .layout-left-split .subtext-container {
      position: absolute;
      bottom: 100px;
      left: 70px;
      width: 560px;
      z-index: 10;
    }

    /* -------------------------------------------------------------
       PLACEMENT 2: layout-right-split (Split Stack, Right-Aligned)
       ------------------------------------------------------------- */
    .layout-right-split .background-img {
      object-position: var(--object-position, 15% center);
    }
    .layout-right-split .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to left, rgba(6, 9, 14, 0.98) 0%, rgba(6, 9, 14, 0.88) 48%, rgba(6, 9, 14, 0.35) 68%, rgba(0, 0, 0, 0) 88%);
    }
    .layout-right-split .headline-container {
      position: absolute;
      top: 100px;
      right: 70px;
      width: 560px;
      text-align: right;
      z-index: 10;
    }
    .layout-right-split .subtext-container {
      position: absolute;
      bottom: 100px;
      right: 70px;
      width: 560px;
      text-align: right;
      z-index: 10;
    }
    .layout-right-split .subtext-italic {
      border-left: none;
      border-right: 5px solid var(--accent-color, #10B981);
      padding-left: 0;
      padding-right: 20px;
    }

    /* -------------------------------------------------------------
       PLACEMENT 3: layout-bottom (Stacked Bottom Overlay)
       ------------------------------------------------------------- */
    .layout-bottom .background-img {
      object-position: var(--object-position, center top);
    }
    .layout-bottom .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(6, 9, 14, 0.98) 0%, rgba(6, 9, 14, 0.90) 40%, rgba(6, 9, 14, 0.40) 65%, rgba(0, 0, 0, 0) 85%);
    }
    .layout-bottom .headline-container {
      position: absolute;
      bottom: 240px;
      left: 70px;
      width: 940px;
      z-index: 10;
    }
    .layout-bottom .subtext-container {
      position: absolute;
      bottom: 100px;
      left: 70px;
      width: 940px;
      z-index: 10;
    }

    /* -------------------------------------------------------------
       PLACEMENT 4: layout-top (Stacked Top Overlay)
       ------------------------------------------------------------- */
    .layout-top .background-img {
      object-position: var(--object-position, center 80%);
    }
    .layout-top .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(6, 9, 14, 0.98) 0%, rgba(6, 9, 14, 0.90) 40%, rgba(6, 9, 14, 0.40) 65%, rgba(0, 0, 0, 0) 85%);
    }
    .layout-top .headline-container {
      position: absolute;
      top: 90px;
      left: 70px;
      width: 940px;
      z-index: 10;
    }
    .layout-top .subtext-container {
      position: absolute;
      top: 360px;
      left: 70px;
      width: 940px;
      z-index: 10;
    }

    /* -------------------------------------------------------------
       SHARED TYPOGRAPHY & HIGHLIGHT STYLES
       ------------------------------------------------------------- */
    .headline {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.15;
      color: #FFFFFF;
      letter-spacing: -2px;
      text-shadow: 0 4px 24px rgba(0,0,0,0.85);
      margin-bottom: 0;
      width: 100%;
    }
    
    .highlight-emerald {
      color: #10B981;
      border-bottom: 5px solid #10B981;
      padding-bottom: 2px;
    }

    .subtext-italic {
      font-size: 26px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.55;
      color: #E2E8F0;
      border-left: 5px solid var(--accent-color, #10B981);
      padding-left: 20px;
      width: 100%;
    }
  </style>
</head>
<body class="layout-{{TEXT_PLACEMENT}}" style="--accent-color: {{ACCENT_HEX}}; --object-position: {{OBJECT_POSITION}};">
  {{BACKGROUND_IMG_HTML}}
  <div class="vignette-overlay"></div>

  <div class="headline-container" id="headline-box">
    <h1 class="headline" id="headline-text">
      {{HEADLINE_HTML}}
    </h1>
  </div>
  <div class="subtext-container" id="subtext-box">
    <p class="subtext-italic" id="subtext-text">
      {{SUBHEADLINE_TEXT}}
    </p>
  </div>
</body>
</html>
