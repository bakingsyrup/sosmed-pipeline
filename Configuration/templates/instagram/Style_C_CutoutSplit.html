<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Style C Cutout Split Polished</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #F8FAFC;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 60px;
    }

    /* Ambient Subtle Canvas Vignette */
    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(220, 38, 38, 0.06) 0%, rgba(248, 250, 252, 0) 70%);
      pointer-events: none;
    }

    /* Top Logo Badge */
    .top-logo-badge {
      display: inline-block;
      background: #DC2626;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 22px;
      padding: 12px 26px;
      border-radius: 10px;
      letter-spacing: 1px;
      z-index: 10;
      align-self: flex-start;
      box-shadow: 0 10px 20px rgba(220, 38, 38, 0.3);
    }

    /* Left Text Container (Width 55%) */
    .text-container {
      position: absolute;
      top: 360px;
      left: 60px;
      width: 520px;
      z-index: 20;
    }
    .headline-red {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.15;
      color: #DC2626;
      margin-bottom: 22px;
      letter-spacing: -1.5px;
    }
    .subtext-dark {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.5;
      color: #1E293B;
    }

    /* Transparent Subject Cutout Standing Tall from Bottom-Right (Londo Ireng Style) */
    .cutout-subject-wrapper {
      position: absolute;
      bottom: 0;
      right: -20px;
      width: 600px;
      height: 1050px;
      z-index: 15;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .hero-cutout-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: right bottom;
      filter: drop-shadow(0 25px 35px rgba(0,0,0,0.25));
    }

    /* Footer Bar */
    .footer-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
      color: #64748B;
      border-top: 2px solid #E2E8F0;
      padding-top: 24px;
      z-index: 30;
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="top-logo-badge">SILVESTER DATA</div>

  <div class="text-container">
    <h1 class="headline-red">Strategi Kas Ethereum $5 Miliar:</h1>
    <p class="subtext-dark">
      Kenapa Bitmine Borong 317.000 ETH Secara Agresif di Tengah Fluktuasi Pasar?
    </p>
  </div>

  <div class="cutout-subject-wrapper">
    <img class="hero-cutout-img" src="{{IMAGE_PATH}}" alt="Transparent Subject Cutout" />
  </div>

  <div class="footer-bar">
    <span>@SilvesterAdAstra</span>
    <span style="color: #DC2626;">GESER ➔</span>
  </div>
</body>
</html>
