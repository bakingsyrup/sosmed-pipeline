<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Style B White Card Overlay Polished</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
    }

    /* Top Hero Photo Section */
    .hero-photo-wrapper {
      width: 100%;
      height: 62%;
      position: relative;
      overflow: hidden;
    }
    .hero-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
    }

    /* Floating White Card Overlay with 3D Layered Red Offset Shadow */
    .card-wrapper {
      position: absolute;
      bottom: 50px;
      left: 60px;
      right: 60px;
      z-index: 10;
      height: 480px;
    }
    /* 3D Red Layer Behind */
    .red-shadow-layer {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 100%;
      height: 100%;
      background: #DC2626;
      border-radius: 20px;
      z-index: 1;
    }
    .white-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 44px 44px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #F1F5F9;
    }

    .headline-red {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.18;
      color: #DC2626;
      margin-bottom: 14px;
      letter-spacing: -1.5px;
    }
    .subtext-dark {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.5;
      color: #1E293B;
    }

    /* Top Logo Badge */
    .top-logo-badge {
      position: absolute;
      top: 50px;
      left: 60px;
      background: #DC2626;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 22px;
      padding: 12px 26px;
      border-radius: 12px;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
      z-index: 10;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
      color: #64748B;
      border-top: 2px solid #F1F5F9;
      padding-top: 18px;
    }
  </style>
</head>
<body>
  <div class="top-logo-badge">SILVESTER MACRO</div>

  <div class="hero-photo-wrapper">
    <img class="hero-photo" src="{{IMAGE_PATH}}" alt="Hero Portrait" />
  </div>

  <div class="card-wrapper">
    <div class="red-shadow-layer"></div>
    <div class="white-card">
      <div>
        <h1 class="headline-red">Kebijakan Tarif Baru Trump:</h1>
        <p class="subtext-dark">
          Dampak Terhadap S&P 500 & Volatilitas Pasar Emerging Market yang Wajib Diwaspadai Investor.
        </p>
      </div>
      <div class="footer-bar">
        <span>@SilvesterAdAstra</span>
        <span style="color: #DC2626;">GESER ➔</span>
      </div>
    </div>
  </div>
</body>
</html>
