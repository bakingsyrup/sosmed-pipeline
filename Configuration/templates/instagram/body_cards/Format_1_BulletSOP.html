<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Format 1: Bullet List SOP (Ultra-Clean No Header/Footer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
      color: #F8FAFC;
      padding: 90px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .main-body-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      gap: 32px;
    }

    .headline-box {
      min-height: 100px;
      max-height: 180px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .headline {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      color: #FFFFFF;
      letter-spacing: -1.5px;
      width: 100%;
    }

    .bullet-container {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 6px solid var(--accent-color, #10B981);
      border-radius: 28px;
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 28px;
    }
    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      font-size: 36px;
      line-height: 1.5;
      color: #CBD5E1;
    }
    .bullet-icon {
      color: var(--accent-color, #10B981);
      font-weight: 900;
      font-size: 40px;
      line-height: 1;
      margin-top: 4px;
    }
    .bullet-text {
      width: 100%;
    }
    .bullet-lead {
      color: #FFFFFF;
      font-weight: 800;
    }
  </style>
</head>
<body style="--accent-color: {{ACCENT_HEX}};">
  <div class="ambient-glow"></div>

  <div class="main-body-container">
    <div class="headline-box">
      <h1 class="headline" id="headline-text">{{HEADLINE_TEXT}}</h1>
    </div>

    <div class="bullet-container" id="bullet-box">
      {{BODY_CONTENT_HTML}}
    </div>
  </div>

  <script>
    function fitGroupToContainer(containerEl, targetFillPercent = 0.85) {
      let items = containerEl.querySelectorAll('.bullet-item');
      let currentFont = 36;
      
      function getItemsHeight() {
        let total = 0;
        items.forEach(it => { total += it.offsetHeight; });
        return total;
      }

      while (getItemsHeight() < containerEl.clientHeight * targetFillPercent && currentFont < 44) {
        currentFont += 1;
        items.forEach(it => { it.style.fontSize = currentFont + 'px'; });
      }
      while (getItemsHeight() > containerEl.clientHeight * 0.92 && currentFont > 24) {
        currentFont -= 1;
        items.forEach(it => { it.style.fontSize = currentFont + 'px'; });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      fitGroupToContainer(document.getElementById('bullet-box'), 0.85);
    });
  </script>
</body>
</html>
