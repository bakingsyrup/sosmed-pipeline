<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Format 4: Rhetorical Q&A Split (Ultra-Clean No Header/Footer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
      color: #F8FAFC;
      padding: 90px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .main-body-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      gap: 32px;
    }

    .headline-box {
      min-height: 100px;
      max-height: 180px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .headline {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      color: #FFFFFF;
      letter-spacing: -1.5px;
      width: 100%;
    }

    .qa-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }
    .qa-pair-container {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 6px solid #10B981;
      border-radius: 24px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .question-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .question-tag-mini {
      font-size: 14px;
      font-weight: 900;
      color: #F43F5E;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .question-text-mini {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
    }
    .answer-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .answer-tag-mini {
      font-size: 14px;
      font-weight: 900;
      color: #10B981;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .answer-text-mini {
      font-size: 23px;
      font-weight: 500;
      color: #CBD5E1;
      line-height: 1.45;
    }
    .question-card {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-left: 8px solid #F43F5E;
      border-radius: 28px;
      padding: 44px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .question-tag {
      font-size: 18px;
      font-weight: 900;
      color: #F43F5E;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .question-text {
      font-size: 34px;
      font-weight: 700;
      color: #F1F5F9;
      line-height: 1.45;
    }

    .answer-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-left: 8px solid #10B981;
      border-radius: 28px;
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }
    .answer-tag {
      font-size: 18px;
      font-weight: 900;
      color: #10B981;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .answer-text {
      font-size: 42px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.5;
    }
  </style>
</head>
<body style="--accent-color: {{ACCENT_HEX}};">
  <div class="ambient-glow"></div>

  <div class="main-body-container">
    <div class="headline-box">
      <h1 class="headline" id="headline-text">{{HEADLINE_TEXT}}</h1>
    </div>

    <div class="qa-stack" id="qa-box">
      {{BODY_CONTENT_HTML}}
    </div>
  </div>

  <script>
    function fitAnswerToCard(ansCardEl, targetFillPercent = 0.85) {
      let aTextEl = ansCardEl.querySelector('.auto-a-text');
      let currentFont = 42;

      while (ansCardEl.offsetHeight < ansCardEl.parentElement.clientHeight * 0.60 && currentFont < 50) {
        currentFont += 1;
        aTextEl.style.fontSize = currentFont + 'px';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      fitAnswerToCard(document.getElementById('ans-card'));
    });
  </script>
</body>
</html>
