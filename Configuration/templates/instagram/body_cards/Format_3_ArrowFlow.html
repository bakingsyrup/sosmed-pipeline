<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Format 3: Arrow Step-by-Step Flow (Ultra-Clean No Header/Footer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
      color: #F8FAFC;
      padding: 90px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .main-body-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      gap: 32px;
    }

    .headline-box {
      min-height: 100px;
      max-height: 180px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .headline {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      color: #FFFFFF;
      letter-spacing: -1.5px;
      width: 100%;
    }

    .step-flow-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    .step-card {
      height: auto;
      flex: 0 1 auto;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 32px 36px;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .step-number-badge {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--accent-color, #10B981);
      color: var(--accent-color, #10B981);
      font-size: 32px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .step-title {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
    }
    .step-desc {
      font-size: 26px;
      color: #CBD5E1;
      line-height: 1.5;
    }
    .arrow-divider {
      text-align: center;
      color: var(--accent-color, #10B981);
      font-size: 28px;
      font-weight: 900;
      margin: -6px 0;
    }
  </style>
</head>
<body style="--accent-color: {{ACCENT_HEX}};">
  <div class="ambient-glow"></div>

  <div class="main-body-container">
    <div class="headline-box">
      <h1 class="headline" id="headline-text">{{HEADLINE_TEXT}}</h1>
    </div>

    <div class="step-flow-container" id="step-box">
      {{BODY_CONTENT_HTML}}
    </div>
  </div>

  <script>
    function fitGroupToContainer(containerEl, targetFillPercent = 0.85) {
      let titles = containerEl.querySelectorAll('.step-title');
      let descs = containerEl.querySelectorAll('.step-desc');
      let titleFont = 32;
      let descFont = 26;

      function getItemsHeight() {
        let total = 0;
        containerEl.querySelectorAll('.step-card').forEach(it => { total += it.offsetHeight; });
        return total;
      }

      while (getItemsHeight() < containerEl.clientHeight * targetFillPercent && descFont < 32) {
        titleFont += 1;
        descFont += 1;
        titles.forEach(t => t.style.fontSize = titleFont + 'px');
        descs.forEach(d => d.style.fontSize = descFont + 'px');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('step-box');
      const cards = container.querySelectorAll('.step-card');
      if (cards.length > 3) {
        cards.forEach(c => {
          c.style.padding = '22px 28px';
          c.style.gap = '20px';
        });
        container.querySelectorAll('.step-number-badge').forEach(b => {
          b.style.width = '58px';
          b.style.height = '58px';
          b.style.fontSize = '24px';
          b.style.borderRadius = '16px';
        });
        container.querySelectorAll('.step-title').forEach(t => {
          t.style.fontSize = '26px';
        });
        container.querySelectorAll('.step-desc').forEach(d => {
          d.style.fontSize = '22px';
        });
        container.querySelectorAll('.arrow-divider').forEach(a => {
          a.style.fontSize = '20px';
          a.style.margin = '-12px 0';
        });
      } else {
        fitGroupToContainer(container, 0.85);
      }
    });
  </script>
</body>
</html>
