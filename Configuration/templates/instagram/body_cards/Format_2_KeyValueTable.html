<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Format 2: Key-Value Table (Ultra-Clean No Header/Footer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
      color: #F8FAFC;
      padding: 90px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    .main-body-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      gap: 32px;
    }

    .headline-box {
      min-height: 100px;
      max-height: 180px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .headline {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.18;
      color: #FFFFFF;
      letter-spacing: -1.5px;
      width: 100%;
    }

    .comparison-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      z-index: 10;
    }
    .card-positive {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-top: 8px solid #10B981;
      border-radius: 28px;
      padding: 52px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-negative {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-top: 8px solid #F43F5E;
      border-radius: 28px;
      padding: 52px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-badge-pos {
      font-size: 18px;
      font-weight: 900;
      color: #10B981;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .card-badge-neg {
      font-size: 18px;
      font-weight: 900;
      color: #F43F5E;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .card-metric-val {
      font-size: 58px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -1.5px;
      line-height: 1.05;
      margin: 20px 0;
      white-space: nowrap;
    }
    .card-desc {
      font-size: 28px;
      line-height: 1.55;
      color: #CBD5E1;
      font-weight: 500;
    }
  </style>
</head>
<body style="--accent-color: {{ACCENT_HEX}};">
  <div class="ambient-glow"></div>

  <div class="main-body-container">
    <div class="headline-box">
      <h1 class="headline" id="headline-text">{{HEADLINE_TEXT}}</h1>
    </div>

    <div class="comparison-grid" id="comp-box">
      {{BODY_CONTENT_HTML}}
    </div>
  </div>

  <script>
    function fitTextToCard(cardEl) {
      if (!cardEl) return;
      let metricEl = cardEl.querySelector('.auto-metric');
      let descEl = cardEl.querySelector('.auto-desc');

      if (metricEl) {
        let metricFont = 58;
        metricEl.style.fontSize = metricFont + 'px';
        while (metricEl.scrollWidth > cardEl.clientWidth - 64 && metricFont > 32) {
          metricFont -= 2;
          metricEl.style.fontSize = metricFont + 'px';
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      fitTextToCard(document.getElementById('card-pos'));
      fitTextToCard(document.getElementById('card-neg'));
    });
  </script>
</body>
</html>
