<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tier 4: High-Density Q&A Split</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
      color: #F8FAFC;
      padding: 90px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.14) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
    .main-body-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      gap: 18px;
    }
    .headline-box {
      min-height: 80px;
      display: flex;
      align-items: center;
    }
    .headline {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.18;
      color: #FFFFFF;
      letter-spacing: -1.2px;
      width: 100%;
    }
    .qa-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 10px;
    }
    .qa-pair-container {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-left: 10px solid #10B981;
      border-radius: 24px;
      padding: 44px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .question-text-mini {
      font-size: 42px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.30;
    }
    .answer-row {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .answer-text-mini {
      font-size: 33px;
      font-weight: 500;
      color: #CBD5E1;
      line-height: 1.32;
    }
  </style>
</head>
<body style="--accent-color: {{ACCENT_HEX}};">
  <div class="ambient-glow"></div>
  <div class="main-body-container">
    <div class="headline-box">
      <h1 class="headline" id="headline-text">{{HEADLINE_TEXT}}</h1>
    </div>
    <div class="qa-stack" id="qa-box">
      {{BODY_CONTENT_HTML}}
    </div>
  </div>
</body>
</html>
