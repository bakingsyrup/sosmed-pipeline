<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tier 4: High-Density Arrow Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background-color: #06090E;
      color: #F8FAFC;
      padding: 90px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.14) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
    .main-body-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      z-index: 10;
      gap: 14px;
    }
    .headline-box {
      min-height: 75px;
      display: flex;
      align-items: center;
    }
    .headline {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.18;
      color: #FFFFFF;
      letter-spacing: -1.2px;
      width: 100%;
    }
    .step-flow-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 6px;
    }
    .step-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 36px 36px;
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .step-number-badge {
      width: 84px;
      height: 84px;
      background: rgba(16, 185, 129, 0.14);
      border: 2px solid var(--accent-color, #10B981);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 900;
      color: var(--accent-color, #10B981);
      flex-shrink: 0;
    }
    .step-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .step-title {
      font-size: 36px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.25;
    }
    .step-desc {
      font-size: 27px;
      font-weight: 500;
      color: #CBD5E1;
      line-height: 1.35;
    }
    .arrow-divider {
      align-self: center;
      font-size: 42px;
      font-weight: 900;
      color: var(--accent-color, #10B981);
      line-height: 1;
    }
  </style>
</head>
<body style="--accent-color: {{ACCENT_HEX}};">
  <div class="ambient-glow"></div>
  <div class="main-body-container">
    <div class="headline-box">
      <h1 class="headline" id="headline-text">{{HEADLINE_TEXT}}</h1>
    </div>
    <div class="step-flow-container" id="flow-box">
      {{BODY_CONTENT_HTML}}
    </div>
  </div>
</body>
</html>
