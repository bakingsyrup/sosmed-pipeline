<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Carousel Slide Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0B0F17;
      color: #F8FAFC;
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 70px;
      position: relative;
      overflow: hidden;
    }
    /* Ambient Glow Background Accents */
    .glow-top-right {
      position: absolute;
      top: -150px;
      right: -150px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
    .glow-bottom-left {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    /* Top Navigation / Brand Header */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 30px;
    }
    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 24px;
      color: #38BDF8;
      letter-spacing: 0.5px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #38BDF8, #818CF8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #0F172A;
    }
    .slide-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Main Content Container */
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 40px 0;
    }
    .headline {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      color: #FFFFFF;
      margin-bottom: 30px;
    }
    .headline highlight {
      color: #38BDF8;
    }
    .subtext {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.6;
      color: #CBD5E1;
    }

    /* Split Screen Comparison Box */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 30px;
    }
    .compare-card {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 16px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .compare-card.positive {
      border-left: 5px solid #10B981;
    }
    .compare-card.negative {
      border-left: 5px solid #F43F5E;
    }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-title.positive { color: #10B981; }
    .card-title.negative { color: #F43F5E; }
    .card-value {
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
    }

    /* Footer Navigation */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 30px;
      font-size: 20px;
      color: #64748B;
      font-weight: 600;
    }
    .swipe-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #38BDF8;
    }
  </style>
</head>
<body>
  <div class="glow-top-right"></div>
  <div class="glow-bottom-left"></div>

  <!-- Header -->
  <div class="slide-header">
    <div class="brand-badge">
      <div class="brand-icon">S</div>
      <span>Silvester Ad Astra</span>
    </div>
    <div class="slide-tag" id="slideTag">GUIDE</div>
  </div>

  <!-- Main Body -->
  <div class="slide-body" id="slideBody">
    <!-- Dynamic content will be injected here by Playwright -->
  </div>

  <!-- Footer -->
  <div class="slide-footer">
    <span id="handleText">@SilvesterAdAstra</span>
    <div class="swipe-indicator">
      <span>GESER</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
  </div>
</body>
</html>
